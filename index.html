<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gerador de Jogo de Palavras - Busca Imagens</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1923;
      --surface: #1a2635;
      --surface2: #243044;
      --accent: #3b9eff;
      --accent2: #00e5a0;
      --danger: #ff4757;
      --text: #e8edf5;
      --muted: #7a8fa6;
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-logo {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.7rem, 2.5vw, 0.85rem);
      color: var(--accent2);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .topbar-logo span { color: var(--muted); }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }
    .btn-ghost {
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: none; color: var(--muted);
      font-size: 12px; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary {
      padding: 7px 16px; border-radius: 8px;
      border: none; background: var(--accent);
      color: #fff; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: all 0.15s; letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #2d8ae0; transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-success {
      padding: 7px 16px; border-radius: 8px;
      border: none; background: var(--accent2);
      color: #0f1923; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-success:hover { opacity: 0.88; }
    .btn-download {
      padding: 14px; border-radius: 10px;
      border: none; background: linear-gradient(135deg, var(--accent2) 0%, #00c853 100%);
      color: #0f1923; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.5px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      touch-action: manipulation;
    }
    .btn-download:hover { opacity: 0.9; transform: translateY(-1px); }
    .main {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 0;
      min-height: calc(100vh - 56px);
      min-height: calc(100dvh - 56px);
    }
    .left-panel {
      padding: 1.5rem;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .section-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .field input[type=text] {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.15s;
      width: 100%;
    }
    .field input[type=text]:focus { outline: none; border-color: var(--accent); }
    
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem 1rem;
      text-align: center;
      margin-bottom: 1rem;
      transition: all 0.2s;
      cursor: pointer;
      background: var(--surface);
      touch-action: manipulation;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(59, 158, 255, 0.05);
    }
    .upload-area .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .upload-area p { color: var(--muted); font-size: 13px; }
    .upload-area input[type=file] { display: none; }
    
    .ocr-preview {
      background: var(--surface);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      display: none;
    }
    .ocr-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 10px;
    }
    .ocr-text {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
      background: #0a1118;
      padding: 10px;
      border-radius: 6px;
    }
    
    /* Word rows com imagens separadas NL/PT */
    .words-header {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 90px 90px 32px;
      gap: 8px;
      padding: 0 4px;
      margin-bottom: 8px;
    }
    .words-header span {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .word-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 90px 90px 32px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      animation: slideIn 0.2s ease;
      background: rgba(255,255,255,0.02);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .word-num {
      width: 40px; height: 36px;
      background: var(--surface2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .word-row input[type=text] {
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      width: 100%;
      transition: border-color 0.15s;
    }
    .word-row input[type=text]:focus { outline: none; border-color: var(--accent); }
    
    .img-slot {
      width: 90px;
      height: 65px;
      border-radius: 8px;
      border: 2px dashed var(--border);
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.15s;
      font-size: 18px;
    }
    .img-slot:hover { border-color: var(--accent); }
    .img-slot.has-img {
      border-style: solid;
      border-color: var(--accent2);
    }
    .img-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .img-slot .remove-img {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--danger);
      color: white;
      border: none;
      font-size: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .img-slot.has-img:hover .remove-img { display: flex; }
    .img-slot .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 9px;
      text-align: center;
      padding: 1px;
    }
    .img-slot .loading {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .del-btn {
      width: 32px; height: 32px;
      border-radius: 6px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 15px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .del-btn:hover { color: var(--danger); background: rgba(255,71,87,0.1); }
    .add-word-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      touch-action: manipulation;
    }
    .add-word-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    
    .right-panel {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 56px);
      height: calc(100dvh - 56px);
      position: sticky;
      top: 56px;
    }
    .preview-panel {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .preview-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      min-height: 50px;
    }
    .prev-card {
      background: var(--surface2);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
      min-width: 56px;
    }
    .prev-card .em { font-size: 18px; }
    .prev-card img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
    }
    .prev-card.txt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--text);
      text-transform: uppercase;
    }
    .output-panel {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

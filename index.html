<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gerador Jogo - Multi Imagens</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1923;
  --surface: #1a2635;
  --surface2: #243044;
  --accent: #3b9eff;
  --accent2: #00e5a0;
  --danger: #ff4757;
  --text: #e8edf5;
  --muted: #7a8fa6;
  --border: rgba(255,255,255,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1rem;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  font-family: 'Space Mono', monospace;
  font-size: 0.85rem;
  color: var(--accent2);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.topbar-logo span { color: var(--muted); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.btn-ghost {
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  font-size: 12px; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  padding: 7px 16px; border-radius: 8px;
  border: none; background: var(--accent);
  color: #fff; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.btn-primary:hover { background: #2d8ae0; }
.btn-success {
  padding: 7px 16px; border-radius: 8px;
  border: none; background: var(--accent2);
  color: #0f1923; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.btn-download {
  padding: 14px; border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--accent2) 0%, #00c853 100%);
  color: #0f1923; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
}
.btn-download:hover { opacity: 0.9; transform: translateY(-1px); }

.main {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 0;
  min-height: calc(100vh - 56px);
  min-height: calc(100dvh - 56px);
}
.left-panel {
  padding: 1.5rem;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}
.right-panel {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 56px);
  height: calc(100dvh - 56px);
  position: sticky;
  top: 56px;
}
.section-title {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 12px;
}
.config-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 1.5rem;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input[type=text] {
  padding: 9px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
}
.field input[type=text]:focus { outline: none; border-color: var(--accent); }

.toggle-mode {
  display: flex;
  gap: 0;
  margin-bottom: 1rem;
  background: var(--surface);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
}
.toggle-mode button {
  flex: 1;
  padding: 8px 10px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.toggle-mode button.active {
  background: var(--surface2);
  color: var(--text);
  font-weight: 600;
}

.paste-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 2rem 1rem;
  text-align: center;
  margin-bottom: 1rem;
  transition: all 0.2s;
  cursor: pointer;
  background: var(--surface);
  touch-action: manipulation;
  position: relative;
}
.paste-area:hover, .paste-area.dragover {
  border-color: var(--accent);
  background: rgba(59, 158, 255, 0.05);
}
.paste-area .icon { font-size: 2.5rem; margin-bottom: 8px; }
.paste-area p { color: var(--muted); font-size: 13px; }
.paste-area .hint {
  font-size: 11px;
  color: var(--accent);
  margin-top: 6px;
}
.paste-area input[type=file] { display: none; }

.pasted-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
  margin-bottom: 1.5rem;
}
.pasted-item {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface2);
  aspect-ratio: 4/3;
}
.pasted-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.pasted-item .remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--danger);
  color: white;
  border: none;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pasted-item .status {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 9px;
  padding: 3px 6px;
  text-align: center;
}

.ocr-preview {
  background: var(--surface);
  border-radius: 10px;
  padding: 1rem;
  margin-bottom: 1.5rem;
  border: 1px solid var(--border);
  display: none;
}
.ocr-preview .toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.ocr-preview .toolbar span { font-size: 11px; color: var(--muted); }
.ocr-text {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  white-space: pre-wrap;
  max-height: 150px;
  overflow-y: auto;
  background: #0a1118;
  padding: 10px;
  border-radius: 6px;
}

.manual-input {
  display: none;
  margin-bottom: 1.5rem;
}
.manual-input textarea {
  width: 100%;
  min-height: 180px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  resize: vertical;
}
.manual-input .hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
}

.words-header {
  display: grid;
  grid-template-columns: 36px 1fr 1fr 80px 80px 28px;
  gap: 6px;
  padding: 0 4px;
  margin-bottom: 8px;
}
.words-header span {
  font-size: 9px;
  color: var(--muted);
  text-align: center;
  text-transform: uppercase;
}
.word-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr 80px 80px 28px;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
  padding: 6px;
  background: rgba(255,255,255,0.02);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.word-num {
  width: 36px;
  height: 28px;
  background: var(--surface2);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted);
}
.word-row input[type=text] {
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
}
.word-row input[type=text]:focus { outline: none; border-color: var(--accent); }

.img-slot {
  width: 80px;
  height: 50px;
  border-radius: 6px;
  border: 2px dashed var(--border);
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-size: 10px;
  color: var(--muted);
  transition: all 0.15s;
}
.img-slot:hover { border-color: var(--accent); color: var(--accent); }
.img-slot.has-img {
  border-style: solid;
  border-color: var(--accent2);
}
.img-slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.img-slot .remove {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--danger);
  color: white;
  border: none;
  font-size: 9px;
  cursor: pointer;
  display: none;
}
.img-slot.has-img:hover .remove { display: block; }
.img-slot .label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 8px;
  text-align: center;
  padding: 1px;
}

.del-btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.del-btn:hover { color: var(--danger); }
.add-word-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  border-radius: 8px;
  border: 1px dashed var(--border);
  background: none;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  justify-content: center;
  margin-top: 4px;
  font-family: 'DM Sans', sans-serif;
}
.add-word-btn:hover { border-color: var(--accent2); color: var(--accent2); }

.preview-panel {
  padding: 1.5rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.preview-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
  min-height: 50px;
}
.prev-card {
  background: var(--surface2);
  border-radius: 8px;
  padding: 6px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  color: var(--muted);
  min-width: 56px;
}
.prev-card img {
  width: 40px;
  height: 40px;
  object-fit: cover;
  border-radius: 4px;
}
.prev-card .em { font-size: 18px; }
.prev-card.txt-card {
  background: var(--surface);
  border: 1px solid var(--border);
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--text);
  text-transform: uppercase;
}

.output-panel {
  flex: 1;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.output-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.code-wrap {
  flex: 1;
  background: #0a1118;
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.code-toolbar {
  background: var(--surface2);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.code-toolbar span {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.code-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: #7ec8a0;
  white-space: pre;
  line-height: 1.6;
}
.placeholder-msg {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.placeholder-msg .big { font-size: 2.5rem; }

.gen-bar {
  padding: 1rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.gen-full-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--accent) 0%, #005bbb 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
}
.gen-full-btn:hover { opacity: 0.9; }
.gen-full-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 25, 35, 0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 15px;
  z-index: 9998;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--surface2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text); font-size: 14px; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent2);
  color: #0f1923;
  padding: 10px 22px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); color: #fff; }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }
  .right-panel { position: relative; top: 0; height: auto; }
  .config-grid { grid-template-columns: 1fr; }
  .words-header { display: none; }
  .word-row { grid-template-columns: 28px 1fr 1fr 1fr 1fr 26px; gap: 4px; padding: 4px; }
  .word-num { width: 28px; height: 28px; font-size: 9px; }
  .img-slot { width: 100%; height: 45px; }
  .word-row input[type=text] { height: 28px; font-size: 11px; }
  .left-panel { padding: 1rem; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">🎮 jogo<span>.gen</span> <span style="color:var(--accent)">MULTI IMG</span></div>
  <div class="topbar-actions">
    <button class="btn-ghost" onclick="clearAll()">Limpar</button>
    <button class="btn-primary" onclick="generate()">⚡ Gerar</button>
  </div>
</div>

<div class="main">
